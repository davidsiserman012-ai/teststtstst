name: Flood Leaderboard

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manual trigger (button in GitHub Actions tab)

jobs:
  flood:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp python-socketio requests beautifulsoup4

      - name: Update map list
        run: python flooder.py --fetch

      - name: Run flooder
        run: python cool.py --flood --auto --scores 5 --concurrency 5 --server random
