name: Flood Leaderboard

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  flood:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp python-socketio requests beautifulsoup4

      - name: Run flooder (no map update)
        run: python cool.py --flood --auto --scores 3 --concurrency 3 --server random
